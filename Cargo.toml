[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Om Jannu"]
rust-version = "1.100"
repository = "https://github.com/Om-jannu/tunwarden"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release builds made by dist (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
