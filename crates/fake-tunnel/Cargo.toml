[package]
name = "fake-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tunwarden-cli = { path = "../tunwarden-cli" }
tunwarden-core = { path = "../tunwarden-core" }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "time", "process"] }
serde_json = "1.0.154"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.32.0", features = ["signal"] }
