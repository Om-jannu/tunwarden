name: Website
# Builds the static site in apps/web, and checks that the brand art in the
# site, the desktop app and the CLI matches docs/brand/concepts/make.py.
on:
  push:
    paths: ["apps/web/**", "docs/brand/**", "apps/desktop/src/art/**", "crates/tunwarden-cli/src/art/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "docs/brand/**", "apps/desktop/src/art/**", "crates/tunwarden-cli/src/art/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pixel art matches the brand drawings
        # Text outputs only: PNG bytes depend on the zlib build.
        run: |
          python3 docs/brand/export.py
          git diff --exit-code apps/web/src/art/pixels.ts apps/desktop/src/art/pixels.ts crates/tunwarden-cli/src/art/drawings.rs
      - run: pnpm --filter tunwarden-web typecheck
      - run: pnpm --filter tunwarden-web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
