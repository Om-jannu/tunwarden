name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test otherwise runs for GitHub's 6-hour limit (Windows minutes count double).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop app has its own job: it needs the webview libraries.
      - run: cargo clippy --workspace --exclude tunwarden-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tunwarden-desktop

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: The TypeScript protocol types are current
        if: runner.os == 'Linux'
        run: |
          cargo test -p tunwarden-core --features ts export_typescript
          git diff --exit-code apps/desktop/src/protocol.ts
      - run: pnpm --filter tunwarden-desktop typecheck
      - run: pnpm --filter tunwarden-desktop build
      - run: pnpm --filter tunwarden-desktop test
      - run: cargo clippy -p tunwarden-desktop --all-targets -- -D warnings
      # Start the real app: it must run its daemon with the CLI next to it,
      # hand a second launch to the running copy, and leave tunnels running
      # when it quits. Debug builds put the CLI next to the app, as bundles do.
      - name: App smoke test
        if: runner.os != 'Windows'
        run: |
          cargo build -p tunwarden-cli -p fake-tunnel -p tunwarden-desktop
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y xvfb dbus-x11
            xvfb-run -a dbus-launch --exit-with-session sh apps/desktop/scripts/smoke.sh "$PWD/target/debug/tunwarden-desktop" "$PWD/target/debug/fake-tunnel"
          else
            sh apps/desktop/scripts/smoke.sh "$PWD/target/debug/tunwarden-desktop" "$PWD/target/debug/fake-tunnel"
          fi

  # The SSH types against real OpenSSH servers in Docker (PRD AC-11). Linux
  # only: GitHub's macOS and Windows runners cannot run Linux containers.
  ssh-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fake-tunnel --test ssh -- --ignored
