# Builds the desktop app installers (unsigned) and adds them to a GitHub
# Release. Run it by hand from the Actions tab after the CLI release for the
# same version exists (docs/desktop.md D14):
#
#   Actions → Desktop app release → Run workflow → tag: v0.1.0
#
# It is not started by tags, because every version tag already starts the CLI
# release (release.yml). Releases created here use the workflow token, which
# does not start other workflows.
name: Desktop app release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to add the app to, for example v0.1.0"
        required: true
      draft:
        description: "The release is (or should be created as) a draft"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  app:
    name: app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x86-64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86-64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
          tagName: ${{ inputs.tag }}
          releaseName: Tunwarden ${{ inputs.tag }}
          releaseDraft: ${{ inputs.draft }}
          releaseBody: |
            Desktop app installers. They are not signed yet: on macOS, open the app once, then System Settings → Privacy & Security → Open Anyway; on Windows, choose More info → Run anyway.
      # The bundle must carry a complete (ad-hoc) signature: a partial one makes
      # macOS call the downloaded app "damaged" (tauri.bundle.conf.json,
      # signingIdentity "-"). Checks the .app inside the uploaded .dmg.
      - name: macOS signature is complete
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          mnt=$(hdiutil attach -nobrowse -readonly -noautoopen "$dmg" | grep -o '/Volumes/.*' | tail -1)
          codesign --verify --deep --strict --verbose=2 "$mnt/Tunwarden.app"
          hdiutil detach "$mnt"
