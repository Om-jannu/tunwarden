[package]
name = "tunwarden-desktop"
description = "Tunwarden desktop app: tray, dashboard and logs for the Tunwarden daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "tunwarden_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "process", "io-util"] }
toml = "1.2.3"
tunwarden-core = { path = "../../../crates/tunwarden-core" }
which = "8.0.6"
tauri-plugin-single-instance = "2.5.5"
