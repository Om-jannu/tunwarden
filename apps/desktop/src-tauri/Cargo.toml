[package]
name = "tunwarden-desktop"
description = "Tunwarden desktop app: tray, dashboard and logs for the Tunwarden daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "tunwarden_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "process", "io-util"] }
toml = "1.2.3"
tunwarden-core = { path = "../../../crates/tunwarden-core" }
which = "8.0.6"
tauri-plugin-single-instance = "2.5.5"

# The tray popover behaves like a menu on macOS: a non-activating panel at
# menu level, on every Space and over full-screen apps (src/lib.rs, mod macos).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSGraphics", "NSRunningApplication"] }
tauri-nspanel = "2.1.1"
